[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedream-sdk"
version = "1.0.0"
description = "Python SDK for BytePlus Seedream 4.5 / 5.0 Lite image generation"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["byteplus", "seedream", "image-generation", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Zero runtime dependencies — uses stdlib urllib only
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpserver>=1.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[project.urls]
Repository = "https://github.com/byteplus/byteplus-seedream"
Documentation = "https://docs.byteplus.com/en/docs/ModelArk/1824121"

[tool.hatch.build.targets.wheel]
packages = ["seedream"]
