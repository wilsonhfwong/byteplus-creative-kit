[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedance-sdk"
version = "2.1.0"
description = "Python SDK for BytePlus Seedance video generation (2.5 + 2.0)"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["byteplus", "seedance", "video-generation", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Zero runtime dependencies — uses stdlib urllib only
dependencies = []

[project.urls]
Repository = "https://github.com/byteplus/byteplus-seedance"
Documentation = "https://docs.byteplus.com/en/docs/ModelArk/2291680"

[tool.hatch.build.targets.wheel]
packages = ["seedance"]
