[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedream-mcp"
version = "1.0.0"
description = "MCP server exposing BytePlus Seedream 4.5 / 5.0 Lite image generation to AI clients"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["byteplus", "seedream", "mcp", "image-generation", "ai"]
dependencies = [
    "seedream-sdk>=1.0.0",
    # mcp 2.0 removed mcp.server.fastmcp, which server.py is built on. Unpinned,
    # a fresh resolve picks 2.x and the server fails to import at all.
    "mcp>=1.0.0,<2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

# seedream-sdk resolves from the workspace rather than PyPI. uv refuses to build a
# member that depends on another member without this.
[tool.uv.sources]
seedream-sdk = { workspace = true }

[project.urls]
Repository = "https://github.com/byteplus/byteplus-seedream"

[tool.hatch.build.targets.wheel]
packages = ["seedream_mcp"]
