name: Desktop plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Native unit tests
        working-directory: native-launcher
        run: go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser regression dependencies
        run: python -m pip install "playwright>=1.50,<2"
      - name: Install Chromium for browser regression
        run: python -m playwright install chromium
      - name: Submit setup form in a real browser
        run: python tests/browser_setup.py
      - name: Submit setup form in Microsoft Edge
        if: runner.os == 'Windows'
        run: python tests/browser_setup.py --browser edge
      - name: Test checked-in desktop launcher with restricted child PATH
        run: python tests/desktop_integration.py
  msix:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Windows AppData redirection inside an MSIX package
        shell: powershell
        run: ./tests/windows-msix.ps1
      - name: Save MSIX regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-diagnostics
          path: ${{ runner.temp }}/Creative Kit MSIX */result.*
          if-no-files-found: ignore
